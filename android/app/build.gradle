plugins { id 'com.android.application' }
android {
 namespace 'org.headachediary.offline'
 compileSdk 36
 defaultConfig { applicationId 'org.headachediary.offline'; minSdk 28; targetSdk 36; versionCode 1; versionName '0.1.0-preview' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { localPreview { if(System.getenv('HD_ANDROID_KEYSTORE')) { storeFile file(System.getenv('HD_ANDROID_KEYSTORE')); storePassword System.getenv('HD_ANDROID_STORE_PASSWORD'); keyAlias 'headache-diary'; keyPassword System.getenv('HD_ANDROID_STORE_PASSWORD') } } }
 buildTypes { debug { applicationIdSuffix '.preview' }; release { minifyEnabled false; if(System.getenv('HD_ANDROID_KEYSTORE')) signingConfig signingConfigs.localPreview } }
}
tasks.register('bundleDiaryAssets', Copy) {
 into layout.buildDirectory.dir('diary-assets')
 from('../../public') { into 'public'; exclude 'sw.js', 'index.html', 'clinician.html', 'app.mjs', 'clinician.mjs' }
 from('../web') { into 'android/web' }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('diary-assets'))
tasks.named('preBuild').configure { dependsOn 'bundleDiaryAssets' }
